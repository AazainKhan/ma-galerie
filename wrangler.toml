name = "ma-galerie"
main = "dist/_worker.js"
compatibility_date = "2025-08-09"
compatibility_flags = ["nodejs_compat"]

# Serve Astro's built static assets alongside the Worker

# Keep assets pointed at the full build directory. We'll exclude `_worker.js`
# from asset upload using a `.assetsignore` file generated at build time.
assets = { directory = "dist" }

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "ma-galerie-images"
preview_bucket_name = "ma-galerie-images-preview"

# Environment variables
[vars]
NODE_ENV = "production"

# Add environment-specific configurations
[env.production]
name = "ma-galerie-prod"

[env.staging]
name = "ma-galerie-staging"

# Performance optimizations
[env.production.vars]
NODE_ENV = "production"

[env.staging.vars]
NODE_ENV = "staging"

# Optional: set bindings/env as needed
# [vars]
# PUBLIC_SOME_VALUE = "..."