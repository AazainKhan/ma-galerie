name = "ma-galerie"
main = "dist/_worker.js"
compatibility_date = "2025-08-09"
compatibility_flags = ["nodejs_compat"]

# Serve Astro's built static assets alongside the Worker

assets = { directory = "dist" }

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "ma-galerie-images"
preview_bucket_name = "ma-galerie-images-preview"

[[d1_databases]]
binding = "DB"
database_name = "ma-galerie-db"
database_id = "85d47795-412f-41f8-bd09-2eddb26619cf"

# Environment variables
[vars]
NODE_ENV = "production"

# Add environment-specific configurations
[env.production]
name = "ma-galerie-prod"

[env.staging]
name = "ma-galerie-staging"

# Performance optimizations
[env.production.vars]
NODE_ENV = "production"

[env.staging.vars]
NODE_ENV = "staging"

# Optional: set bindings/env as needed
# [vars]
# PUBLIC_SOME_VALUE = "..."